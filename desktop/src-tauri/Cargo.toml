[package]
name = "vally-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
bench = ["dep:tungstenite"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = "=2.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "=0.29.0", optional = true, default-features = false, features = ["handshake"] }

[dev-dependencies]
tauri = { version = "=2.12.7", features = ["test"] }
minisign = "=0.10.0"
base64 = "0.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
