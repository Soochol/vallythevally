<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>분봉 선택</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0}
a{color:#C7F36B}a:hover{color:#DAF9A0}
</style>
</helmet>
<div style="width: 760px; height: 560px; box-sizing: border-box; padding: 32px; background: #080B09; color: #F0F4EC; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 12px; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; color: #AEB8A8; font-size: 12px">분봉 버튼을 눌러 보세요. 일봉에서 누르면 마지막 분봉으로 바뀌고, 분봉에서 다시 누르면 목록이 열립니다.</p>
<div style="position: relative; display: flex; align-items: center; gap: 4px; height: 48px; padding: 0 12px; border-radius: 16px; background: #1B211B; box-shadow: 0 0 0 1px rgba(255,255,255,0.10), inset 0 1px 0 rgba(255,255,255,0.09)">
<span style="display: flex; align-items: center; gap: 6px; padding-right: 4px; font-size: 14px; font-weight: 700"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C7F36B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 9-10"></path></svg>vally</span>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border-radius: 9px; background: rgba(255,255,255,0.085)"><b style="font-weight: 600">한빛전자</b><span style="color: #AEB8A8">900010 · KRX</span></span>
<span style="width: 1px; height: 20px; margin: 0 4px; background: rgba(255,255,255,0.08)"></span>
<div style="position: relative; display: flex; align-items: center; gap: 1px">
<button type="button" aria-haspopup="menu" onClick="{{ pressMinute }}" style="{{ minuteStyle }}">{{ minuteLabel }}<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-for list="{{ longs }}" as="p" hint-placeholder-count="5">
<button type="button" onClick="{{ p.pick }}" style="{{ p.style }}">{{ p.label }}</button>
</sc-for>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
<div role="menu" aria-label="분봉" style="position: absolute; left: 0; top: 34px; z-index: 2; width: 156px; padding: 4px; border-radius: 16px; background: #1B211B; box-shadow: 0 0 0 1px rgba(255,255,255,0.10), inset 0 1px 0 rgba(255,255,255,0.09), 0 24px 60px rgba(0,0,0,0.55); display: flex; flex-direction: column; gap: 1px">
<sc-for list="{{ minutes }}" as="m" hint-placeholder-count="7">
<button type="button" role="menuitemradio" onClick="{{ m.pick }}" style="{{ m.style }}">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C7F36B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="{{ m.checkStyle }}"><path d="M5 12l5 5 9-10"></path></svg>
<span style="flex: 1; text-align: left">{{ m.label }}</span>
<sc-if value="{{ m.hasKey }}" hint-placeholder-val="{{ true }}">
<span style="padding: 0 5px; border: 1px solid rgba(255,255,255,0.16); border-bottom-width: 2px; border-radius: 6px; background: #141914; color: #AEB8A8; font-size: 11px; line-height: 16px">{{ m.key }}</span>
</sc-if>
</button>
</sc-for>
</div>
</sc-if>
</div>
<span style="width: 1px; height: 20px; margin: 0 4px; background: rgba(255,255,255,0.08)"></span>
<span style="display: inline-flex; align-items: center; height: 30px; padding: 0 8px; color: #F0F4EC">지표</span>
<span style="display: inline-flex; align-items: center; height: 30px; padding: 0 8px; color: #F0F4EC">비교</span>
</div>
<div style="margin-top: auto; display: flex; gap: 12px">
<div style="flex: 1; padding: 14px 16px; border-radius: 12px; background: #141914; display: flex; flex-direction: column; gap: 4px">
<span style="color: #AEB8A8; font-size: 11px">지금 봉 주기</span>
<span style="font-size: 17px; font-weight: 600; color: #C7F36B">{{ periodLabel }}</span>
</div>
<div style="flex: 1; padding: 14px 16px; border-radius: 12px; background: #141914; display: flex; flex-direction: column; gap: 4px">
<span style="color: #AEB8A8; font-size: 11px">마지막으로 고른 분봉</span>
<span style="font-size: 17px; font-weight: 600">{{ minuteLabel }}</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":560}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const period = s.period ?? 'D';
const last = s.last ?? '3m';
const open = s.open ?? false;
const LABEL = { '1m': '1분', '3m': '3분', '5m': '5분', '10m': '10분', '15m': '15분', '30m': '30분', '60m': '60분', D: '일', W: '주', M: '월', Q: '분기', Y: '년' };
const KEYS = { '1m': '1', '3m': '3', '5m': '5', '15m': 'Shift 1', '30m': 'Shift 3', '60m': 'Shift 6' };
const isMinute = period.endsWith('m');
const seg = 'display:inline-flex;align-items:center;gap:4px;height:26px;min-width:27px;padding:0 8px;border-radius:7px;font-size:12px;white-space:nowrap;';
const on = 'background:#C7F36B;color:#131B05;font-weight:600;';
const off = 'color:#AEB8A8;';
return {
open,
periodLabel: LABEL[period],
minuteLabel: LABEL[last],
minuteStyle: seg + (isMinute ? on : off),
pressMinute: () => this.setState(isMinute ? { open: !open } : { period: last, open: false }),
longs: ['D', 'W', 'M', 'Q', 'Y'].map((p) => ({ label: LABEL[p], style: seg + 'justify-content:center;' + (period === p ? on : off), pick: () => this.setState({ period: p, open: false }) })),
minutes: ['1m', '3m', '5m', '10m', '15m', '30m', '60m'].map((p) => ({
label: LABEL[p],
key: KEYS[p] ?? '',
hasKey: Boolean(KEYS[p]),
style: 'display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 8px;border-radius:9px;font-size:12px;' + (period === p ? 'background:rgba(199,243,107,0.15);color:#C7F36B;font-weight:600;' : 'color:#F0F4EC;'),
checkStyle: period === p ? 'opacity:1' : 'opacity:0',
pick: () => this.setState({ period: p, last: p, open: false }),
})),
};
}
}
</script>
</body>
</html>
