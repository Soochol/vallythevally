<!doctype html>
<html lang="ko" data-theme="dark">
<head>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <symbol id="i-vline" viewBox="0 0 24 24"><path d="M12 3v18"/><circle cx="12" cy="12" r="1.8"/></symbol>
    <symbol id="i-rect" viewBox="0 0 24 24"><rect x="4.5" y="6.5" width="15" height="11" rx="1"/></symbol>
    <symbol id="i-fib" viewBox="0 0 24 24"><path d="M4 5h16M4 9.5h11M4 13.5h14M4 19h16"/><path d="M6 19 18 5" stroke-dasharray="1.5 2.5"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M6 6h12M12 6v13M9.5 19h5"/></symbol>

    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/></symbol>

<div class="app" id="app">
  <!-- 휴대폰 머리 -->
  <header class="m-head m-only" id="mHead"></header>
  <nav class="m-per m-only" id="mPer" aria-label="봉 주기"></nav>

  <header class="topbar d-only" role="toolbar" aria-label="차트 도구 막대">
    <span class="brand" title="vallythevally"><svg class="i"><use href="#i-brand"/></svg></span>
    <button class="tb-btn sym-btn" id="symBtn" aria-haspopup="dialog" title="종목 검색 (/ 또는 Ctrl+K)"></button>
    <span class="tb-sep"></span>
    <div class="seg" id="periodSeg" role="group" aria-label="봉 주기"></div>
    <span class="tb-sep"></span>
    <button class="tb-btn" title="봉 모양"><svg class="i"><use href="#i-candle"/></svg><svg class="i" style="width:12px;height:12px"><use href="#i-chev"/></svg></button>
    <button class="tb-btn" id="indBtn" aria-haspopup="dialog" title="지표 추가 (I)"><svg class="i"><use href="#i-ind"/></svg>지표</button>
    <button class="tb-btn" id="cmpBtn" aria-haspopup="dialog" title="비교 종목 (최대 3개)"><svg class="i"><use href="#i-cmp"/></svg>비교</button>
    <button class="tb-btn" id="logBtn" aria-pressed="false" title="로그 축 (L)">로그</button>
    <span class="grow"></span>
    <button class="tb-btn" title="레이아웃 바꾸기"><b id="layoutName" style="font-weight:600"></b><svg class="i" style="width:12px;height:12px"><use href="#i-chev"/></svg></button>
    <button class="arr-btn" title="새 레이아웃으로 복제"><svg class="i"><use href="#i-dup"/></svg></button>
    <div class="seg" id="arrSeg" role="group" aria-label="칸 배치"></div>
    <span class="tb-sep"></span>
    <button class="toggle-chip" id="syncCross" aria-pressed="true" title="칸끼리 십자선 시각 맞추기">십자선</button>
    <button class="toggle-chip" id="syncScroll" aria-pressed="true" title="같은 봉 주기 칸끼리 스크롤 맞추기">스크롤</button>
    <span class="tb-sep"></span>
    <button class="tb-btn" id="alertBtn" aria-haspopup="dialog" title="알림 만들기 (Alt+A)"><svg class="i"><use href="#i-bell"/></svg>알림</button>
    <button class="icon-btn" id="themeBtn" title="테마 바꾸기"><svg class="i"><use href="#i-sun"/></svg></button>
  </header>

  <nav class="tools d-only" id="tools" role="toolbar" aria-orientation="vertical" aria-label="드로잉 도구"></nav>

  <main class="grid" id="grid" aria-label="칸"></main>

  <aside class="watch" id="watch" aria-label="관심종목">
    <div class="watch-head">
      <h2>관심종목</h2><span class="count" id="watchCount"></span>
      <span class="grow"></span>
      <button class="icon-btn" title="관심종목에 추가"><svg class="i"><use href="#i-plus"/></svg></button>
      <button class="icon-btn collapse d-only" id="watchCollapse" title="관심종목 접기 (Alt+W)"><svg class="i"><use href="#i-chev-r"/></svg></button>
    </div>
    <div class="watch-cols"><span>종목</span><span>현재가</span><span>등락률</span></div>
    <ul class="watch-list" id="watchList"></ul>
    <div class="watch-foot d-only">끌어서 순서를 바꿉니다</div>
  </aside>

  <footer class="status d-only">
    <span class="conn" data-state="live" title="키움 실시간 연결 상태"><span class="dot"></span>실시간 연결됨</span>
    <span class="muted">구독 15종목</span>
    <span class="saved"><svg class="i"><use href="#i-check"/></svg><span id="savedText">자동 저장됨 14:32:08</span></span>
    <span class="grow"></span>
    <span class="muted">목업: 가짜 데이터</span>
    <a class="muted" href="https://www.tradingview.com/" target="_blank" rel="noopener" style="color:inherit">Charts by TradingView Lightweight Charts™</a>
    <span class="muted"><kbd>?</kbd> 단축키</span>
  </footer>

  <nav class="m-tabs m-only" id="mTabs" aria-label="휴대폰 탭">
    <button aria-pressed="true" data-tab="chart"><svg class="i"><use href="#i-chart"/></svg>차트</button>
    <button aria-pressed="false" data-tab="watch"><svg class="i"><use href="#i-list"/></svg>관심종목</button>
    <button aria-pressed="false" data-tab="search"><svg class="i"><use href="#i-search"/></svg>검색</button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>

<script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
