approval = "agent"
require_head = true
respawn = []
remote = "origin"
serialize = false
env_check = ["cargo --version", "node --version"]
preflight = "never"
post_verify_interval = 180

[[verify]]
name = "check"
run = "env VALLY_COMPILE_LANE=gate python3 scripts/web.py check"

[[verify]]
name = "clippy"
run = "env VALLY_COMPILE_LANE=gate python3 scripts/dev.py cargo clippy -p server -p hoga-format -p collector -p account-server -p setup --all-targets -- -D warnings"
paths = ["crates/", "Cargo.toml", "Cargo.lock"]

[[verify]]
name = "collector-test"
run = "env VALLY_COMPILE_LANE=gate python3 scripts/dev.py cargo test -p hoga-format -p collector"
failed = 'test (\S+) \.\.\. FAILED'
paths = [
  "crates/collector/",
  "crates/hoga-format/",
  "crates/server/",
  "crates/domain/",
  "crates/indicators/",
  "Cargo.toml",
  "Cargo.lock",
  ".cargo/",
]

[[verify]]
name = "account-server-test"
run = "env VALLY_COMPILE_LANE=gate python3 scripts/dev.py cargo test -p account-server"
failed = 'test (\S+) \.\.\. FAILED'
paths = [
  "crates/account-server/",
  "crates/setup/",
  "Cargo.toml",
  "Cargo.lock",
  ".cargo/",
]

[[verify]]
name = "setup-test"
run = "env VALLY_COMPILE_LANE=gate python3 scripts/dev.py cargo test -p setup"
failed = 'test (\S+) \.\.\. FAILED'
paths = ["crates/setup/", "Cargo.toml", "Cargo.lock"]

[[verify]]
name = "server-test"
run = "env VALLY_COMPILE_LANE=gate python3 scripts/dev.py cargo test -p server"
failed = 'test (\S+) \.\.\. FAILED'
paths = [
  "crates/server/",
  "crates/setup/",
  "crates/account-server/",
  "crates/domain/",
  "crates/indicators/",
  "web/src/api/generated/",
  "Cargo.toml",
  "Cargo.lock",
  ".cargo/",
]

[[post_verify]]
name = "e2e"
run = "env VALLY_COMPILE_LANE=gate python3 scripts/web.py e2e --workers=6"
probe = "env VALLY_COMPILE_LANE=gate python3 scripts/web.py e2e {tests}"
timeout = 1800
failed = '✘.*?› (e2e/\S+?\.spec\.ts:\d+):\d+ ›'
paths = [
  "web/",
  "crates/domain/",
  "crates/indicators/",
  "crates/indicators-wasm/",
  "Cargo.toml",
  "Cargo.lock",
  ".cargo/",
  "rust-toolchain",
  "rust-toolchain.toml",
  "package.json",
  "pnpm-workspace.yaml",
  "scripts/web.py",
  "scripts/dev.py",
  "scripts/evidence.py",
]
