approval = "agent"
require_head = true
respawn = []
remote = "origin"
serialize = false
env_check = ["cargo --version", "node --version"]

[[verify]]
name = "check"
run = "env VALLY_COMPILE_LANE=gate python3 scripts/web.py check"

[[verify]]
name = "clippy"
run = "env VALLY_COMPILE_LANE=gate python3 scripts/dev.py cargo clippy -p server -p hoga-format -p collector --all-targets -- -D warnings"
paths = ["crates/", "Cargo.toml", "Cargo.lock"]

[[verify]]
name = "collector-test"
run = "env VALLY_COMPILE_LANE=gate python3 scripts/dev.py cargo test -p hoga-format -p collector"
failed = 'test (\S+) \.\.\. FAILED'
paths = [
  "crates/collector/",
  "crates/hoga-format/",
  "crates/server/",
  "crates/domain/",
  "crates/indicators/",
  "Cargo.toml",
  "Cargo.lock",
  ".cargo/",
]

[[verify]]
name = "server-test"
run = "env VALLY_COMPILE_LANE=gate python3 scripts/dev.py cargo test -p server"
failed = 'test (\S+) \.\.\. FAILED'
paths = [
  "crates/server/",
  "crates/domain/",
  "crates/indicators/",
  "Cargo.toml",
  "Cargo.lock",
  ".cargo/",
]

[[verify]]
name = "e2e"
run = "env VALLY_COMPILE_LANE=gate python3 scripts/web.py e2e --workers=6"
probe = "env VALLY_COMPILE_LANE=gate python3 scripts/web.py e2e {tests}"
timeout = 1800
failed = '✘.*?› (e2e/\S+?\.spec\.ts:\d+):\d+ ›'
paths = [
  "web/",
  "crates/domain/",
  "crates/indicators/",
  "crates/indicators-wasm/",
  "Cargo.toml",
  "Cargo.lock",
  ".cargo/",
  "scripts/web.py",
  "scripts/dev.py",
  "scripts/chromium.mjs",
]
