[workspace]
resolver = "3"
members = ["crates/domain", "crates/indicators", "crates/indicators-wasm", "crates/server", "crates/hoga-format", "crates/collector", "crates/setup"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.libduckdb-sys]
opt-level = 3
debug = false

[profile.dev.package.duckdb]
opt-level = 3

[profile.dev.package.indicators]
opt-level = 3
