[workspace]
resolver = "3"
members = ["crates/domain", "crates/fake-kiwoom", "crates/indicators", "crates/indicators-wasm", "crates/server"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev.package.libduckdb-sys]
opt-level = 3
debug = false
