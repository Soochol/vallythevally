[package]
name = "server"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vally-server"
path = "src/main.rs"

[dependencies]
domain = { path = "../domain" }
indicators = { path = "../indicators" }
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "signal"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ts-rs = "11"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
duckdb = { version = "~1.20000.1", default-features = false, features = ["bundled"] }
roxmltree = { version = "0.20", default-features = false }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
scraper = { version = "0.29", default-features = false }

[dev-dependencies]
fake-kiwoom = { path = "../fake-kiwoom" }
tokio = { version = "1", features = ["test-util", "process", "io-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tracing-log = "0.2"

[lints]
workspace = true
