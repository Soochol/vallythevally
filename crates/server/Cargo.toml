[package]
name = "server"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vally-server"
path = "src/main.rs"

[dependencies]
domain = { path = "../domain" }
indicators = { path = "../indicators" }
axum = "0.8"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "signal"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ts-rs = "11"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "process", "io-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
