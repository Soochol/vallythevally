[package]
name = "collector"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["bundled-duckdb"]
bundled-duckdb = ["server/bundled-duckdb"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "collector"
path = "src/main.rs"

[dependencies]
hoga-format = { path = "../hoga-format" }
server = { path = "../server", default-features = false }
domain = { path = "../domain" }
axum = "0.8"
brotli = "9"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query"] }
rustix = { version = "1", features = ["process", "fs", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "signal", "process", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zstd = "0.13"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
arrow-array = "60"
arrow-schema = "60"

[dev-dependencies]
account-server = { path = "../account-server", features = ["fake-idp"] }
tokio = { version = "1", features = ["test-util", "process", "io-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
duckdb = { version = "~1.20000.1", default-features = false }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tracing-log = "0.2"

[lints]
workspace = true
